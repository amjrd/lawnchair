name: CI

on:
  push:
    branches: [ "main", "16-dev" ]
  pull_request:
    branches: [ "main", "16-dev" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Lawnchair Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-debug-apk
          path: |
            build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 14
